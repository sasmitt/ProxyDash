<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Advanced Proxy Checker &amp; Analyzer — ProxyCheck
  <meta name="description" content="Fast proxy validation tool for HTTP, HTTPS, SOCKS4 and SOCKS5 proxies with latency, location, ASN, ISP, anonymity and connectivity analysis.">
  <meta name="keywords" content="proxy checker, proxy tester, proxy analyzer, HTTP proxy checker, HTTPS proxy checker, SOCKS5 checker, SOCKS4 checker, proxy latency checker, proxy IP checker, proxy location checker, ASN checker, proxy validation">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css?v=1.0.1">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="#04121f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.7 2.6 4 5.7 4 9s-1.3 6.4-4 9c-2.7-2.6-4-5.7-4-9s1.3-6.4 4-9z"></path>
          </svg>
        </div>
        <div>
          <div class="brand-name">ProxyCheck</div>
          <div class="brand-sub">Advanced Proxy Analyzer</div>
        </div>
      </div>
      <nav class="nav" aria-label="Main navigation">
        <a href="/" aria-current="page">Checker</a>
        <a href="/about.html">About</a>
      </nav>
      <button class="icon-btn" id="theme-toggle" title="Toggle dark / light theme" aria-label="Toggle theme">
        <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main id="main" class="container">
    <div class="demo-banner" id="demo-banner" role="status">
      Demo data is loaded — these are generated sample results, not live checks. Start a check to test real proxies.
    </div>

    <!-- ------------------------------------------------ input -->
    <section class="card" aria-labelledby="input-heading">
      <div class="card-head">
        <h2 id="input-heading">Proxy input</h2>
        <span class="spacer"></span>
        <span class="section-note">One proxy per line — formats are auto-detected</span>
      </div>
      <div class="card-body">
        <label class="sr-only" for="proxy-input">Proxy list, one proxy per line</label>
        <textarea id="proxy-input" spellcheck="false" autocomplete="off"
          placeholder="1.2.3.4:8080&#10;5.6.7.8:3128:user:pass&#10;user:pass@9.9.9.9:1080&#10;socks5://10.10.10.10:1080&#10;http://11.11.11.11:8080"></textarea>
        <div class="parse-summary" id="parse-summary" aria-live="polite"></div>
        <div class="toolbar">
          <button class="btn" id="upload-btn" type="button">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 16V4m0 0 4 4m-4-4L8 8"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
            Upload .txt
          </button>
          <input type="file" id="file-input" accept=".txt,.csv,.list,text/plain" class="sr-only" aria-label="Upload proxy list file">
          <button class="btn" id="clear-btn" type="button">Clear</button>
          <button class="btn" id="demo-btn" type="button">Load demo data</button>
          <span class="section-note" id="conn-status"><span class="conn-dot" id="conn-dot"></span><span id="conn-label">API connecting…</span></span>
        </div>

        <div class="settings-grid" role="group" aria-label="Check settings">
          <div class="field">
            <label for="set-protocol">Protocol</label>
            <select id="set-protocol">
              <option value="auto">Auto-detect</option>
              <option value="http">HTTP</option>
              <option value="https">HTTPS</option>
              <option value="socks4">SOCKS4</option>
              <option value="socks4a">SOCKS4A</option>
              <option value="socks5">SOCKS5</option>
            </select>
          </div>
          <div class="field">
            <label for="set-timeout">Timeout (s)</label>
            <input type="number" id="set-timeout" min="1" max="30" step="1" value="8">
          </div>
          <div class="field">
            <label for="set-concurrency">Concurrency</label>
            <input type="number" id="set-concurrency" min="1" max="500" step="1" value="100">
          </div>
          <div class="field">
            <label for="set-retries">Retries</label>
            <input type="number" id="set-retries" min="0" max="3" step="1" value="1">
          </div>
          <div class="field">
            <label class="check-field" for="set-https" style="padding-top:24px">
              <input type="checkbox" id="set-https" checked> HTTPS / TLS test
            </label>
          </div>
        </div>

        <div class="start-row">
          <button class="btn primary" id="start-btn" type="button">START CHECK</button>
          <span class="section-note" id="start-hint"></span>
        </div>
      </div>
    </section>

    <!-- ------------------------------------------------ progress -->
    <section class="card progress-wrap" id="progress-card" aria-labelledby="progress-heading">
      <div class="card-head">
        <h2 id="progress-heading">Checking proxies…</h2>
        <span class="spacer"></span>
        <span class="section-note mono" id="job-id-label"></span>
      </div>
      <div class="card-body">
        <div class="progress-line1">
          <span class="progress-pct" id="progress-pct">0%</span>
          <span class="progress-title" id="progress-count">0 / 0 checked</span>
          <span class="progress-title" id="progress-status" aria-live="polite"></span>
        </div>
        <div class="progress-track" role="progressbar" aria-label="Check progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="progress-counts">
          <span class="alive">Alive: <b id="pc-alive">0</b></span>
          <span class="dead">Dead: <b id="pc-dead">0</b></span>
          <span class="to">Timeout: <b id="pc-timeout">0</b></span>
          <span class="dead">Errors: <b id="pc-errors">0</b></span>
          <span>Avg latency: <b id="pc-avg">—</b></span>
          <span>ETA: <b id="pc-eta">--:--</b></span>
          <span>Workers: <b id="pc-conc">0</b></span>
        </div>
        <div class="progress-controls">
          <button class="btn" id="pause-btn" type="button">Pause</button>
          <button class="btn" id="resume-btn" type="button" disabled>Resume</button>
          <button class="btn danger" id="cancel-btn" type="button">Cancel</button>
          <button class="btn" id="restart-btn" type="button" disabled>Restart</button>
        </div>
        <p class="section-note" style="margin:12px 2px 0">
          Proxy status is a point-in-time measurement — a proxy can become unavailable immediately after a check.
        </p>
      </div>
    </section>

    <!-- ------------------------------------------------ dashboard -->
    <section class="card" id="dashboard-card" aria-labelledby="dash-heading" hidden>
      <div class="card-head">
        <h2 id="dash-heading">Dashboard</h2>
        <span class="spacer"></span>
        <span class="section-note">Live aggregates · validation accuracy depends on the target, timeout, network conditions, proxy behavior, and geolocation provider</span>
      </div>
      <div class="card-body">
        <div class="stat-grid" id="stat-grid"></div>
        <div class="charts-grid">
          <div class="chart-card">
            <h3>Latency distribution (alive proxies)</h3>
            <div id="chart-latency"></div>
          </div>
          <div class="chart-card">
            <h3>Alive / dead ratio</h3>
            <div id="chart-alive"></div>
          </div>
          <div class="chart-card">
            <h3>Protocol distribution</h3>
            <div id="chart-protocol"></div>
          </div>
          <div class="chart-card">
            <h3>Top countries (alive)</h3>
            <div id="chart-country"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- ------------------------------------------------ results -->
    <section class="card" id="results-card" aria-labelledby="results-heading" hidden>
      <div class="card-head" style="border-bottom:none">
        <h2 id="results-heading">Results</h2>
        <span class="spacer"></span>
        <button class="btn small" id="recheck-selected-btn" type="button" disabled>Recheck selected</button>
        <button class="btn small" id="recheck-failed-btn" type="button" disabled>Recheck failed</button>
        <button class="btn small primary" id="export-btn" type="button">Export…</button>
      </div>
      <div class="filters" role="group" aria-label="Result filters">
        <label class="f-label" for="f-status">Status</label>
        <select id="f-status"><option value="all">All</option><option value="alive">Alive</option><option value="dead">Dead</option></select>
        <label class="f-label" for="f-protocol">Protocol</label>
        <select id="f-protocol">
          <option value="all">All</option><option value="http">HTTP</option><option value="https">HTTPS</option>
          <option value="socks4">SOCKS4</option><option value="socks4a">SOCKS4A</option><option value="socks5">SOCKS5</option>
        </select>
        <label class="f-label" for="f-speed">Speed</label>
        <select id="f-speed">
          <option value="all">All</option><option value="fast">Fast (≤300ms)</option>
          <option value="moderate">Moderate</option><option value="slow">Slow (&gt;700ms)</option>
        </select>
        <label class="f-label" for="f-https">HTTPS</label>
        <select id="f-https"><option value="all">All</option><option value="supported">Supported</option><option value="failed">Failed</option></select>
        <label class="f-label" for="f-anon">Anonymity</label>
        <select id="f-anon">
          <option value="all">All</option><option value="elite">Elite</option><option value="anonymous">Anonymous</option>
          <option value="transparent">Transparent</option><option value="unknown">Unknown</option>
        </select>
        <label class="f-label" for="f-auth">Auth</label>
        <select id="f-auth"><option value="all">All</option><option value="no">Unauthenticated</option><option value="required">Authenticated</option><option value="failed">Auth failed</option></select>
        <label class="f-label" for="f-country">Country</label>
        <select id="f-country"><option value="">All</option></select>
        <label class="f-label" for="f-asn">ASN</label>
        <select id="f-asn"><option value="">All</option></select>
        <input type="search" id="f-search" placeholder="Search IP, city, ISP…" aria-label="Search results">
        <button class="btn small" id="f-clear" type="button">Reset</button>
      </div>
      <div class="result-meta">
        <span id="results-meta"></span>
        <span class="section-note">Click a row for full details · sort by clicking column headers</span>
      </div>
      <div class="tbl-outer">
        <div class="tbl-header" role="row" id="tbl-header">
          <div class="h-cell check-cell"><input type="checkbox" id="select-all" aria-label="Select visible rows"></div>
          <div class="h-cell" data-sort="input" role="button" tabindex="0">Proxy</div>
          <div class="h-cell" data-sort="protocol" role="button" tabindex="0">Protocol</div>
          <div class="h-cell" data-sort="exitIp" role="button" tabindex="0">Exit IP</div>
          <div class="h-cell" data-sort="country" role="button" tabindex="0">Country</div>
          <div class="h-cell">City</div>
          <div class="h-cell">ASN</div>
          <div class="h-cell">ISP</div>
          <div class="h-cell" data-sort="latency" role="button" tabindex="0">Latency</div>
          <div class="h-cell">HTTPS</div>
          <div class="h-cell">Anonymity</div>
          <div class="h-cell">Auth</div>
          <div class="h-cell" data-sort="httpStatus" role="button" tabindex="0">HTTP</div>
          <div class="h-cell" data-sort="checkedAt" role="button" tabindex="0">Last checked</div>
        </div>
        <div class="tbl-scroller" id="tbl-scroller">
          <div class="tbl-spacer" id="tbl-spacer"></div>
          <div class="tbl-empty" id="tbl-empty">No results yet — start a check or load demo data.</div>
        </div>
      </div>
    </section>
  </main>

  <!-- ------------------------------------------------ detail drawer -->
  <div class="drawer-backdrop" id="drawer-backdrop"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="drawer-head">
      <h2 id="drawer-title">Proxy details</h2>
      <button class="icon-btn" id="drawer-close" aria-label="Close details panel">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
    <div class="drawer-foot">
      <button class="btn small" id="d-copy" type="button">Copy</button>
      <button class="btn small" id="d-export" type="button">Export this</button>
      <button class="btn small" id="d-recheck" type="button">Recheck</button>
    </div>
  </aside>

  <!-- ------------------------------------------------ export modal -->
  <div class="modal-backdrop" id="export-modal" role="dialog" aria-modal="true" aria-labelledby="export-title">
    <div class="modal">
      <div class="modal-head">
        <h2 id="export-title">Export results</h2>
        <button class="icon-btn" id="export-close" aria-label="Close export dialog">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="modal-body">
        <h4>Format</h4>
        <div class="radio-row" role="radiogroup" aria-label="Export format">
          <label class="radio-pill"><input type="radio" name="exp-format" value="txt" checked><span>TXT</span></label>
          <label class="radio-pill"><input type="radio" name="exp-format" value="csv"><span>CSV</span></label>
          <label class="radio-pill"><input type="radio" name="exp-format" value="json"><span>JSON</span></label>
        </div>
        <h4>Scope</h4>
        <div class="radio-row" role="radiogroup" aria-label="Export scope">
          <label class="radio-pill"><input type="radio" name="exp-scope" value="filtered" checked><span>Current filter</span></label>
          <label class="radio-pill"><input type="radio" name="exp-scope" value="alive"><span>Alive only</span></label>
          <label class="radio-pill"><input type="radio" name="exp-scope" value="dead"><span>Dead only</span></label>
          <label class="radio-pill"><input type="radio" name="exp-scope" value="all"><span>All</span></label>
        </div>
        <div class="check-field" style="padding-top:4px">
          <input type="checkbox" id="exp-scheme">
          <label for="exp-scheme">Include protocol prefix in TXT (e.g. socks5://1.2.3.4:1080)</label>
        </div>
        <div class="check-field">
          <input type="checkbox" id="exp-creds">
          <label for="exp-creds">Include credentials (user:pass@host:port)</label>
        </div>
        <div class="warning-note" id="exp-cred-note" hidden>
          Passwords will be included for authenticated proxies you imported. Only enable this if you intend to preserve credentials.
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn" id="export-copy" type="button">Copy to clipboard</button>
        <button class="btn primary" id="export-download" type="button">Download</button>
      </div>
    </div>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <footer class="site-footer">
    <div class="container">
      <div>ProxyCheck — Advanced proxy validation and network metadata analysis. <b>Developed by Diwas Khatri.</b></div>
      <div>IP geolocation is approximate and may be inaccurate. Proxy status is a point-in-time measurement.</div>
      <div>Validation accuracy depends on the target, timeout, network conditions, proxy behavior, and geolocation provider.</div>
      <div>Intended for testing proxies you supply or are authorized to test. © 2026 Diwas Khatri</div>
    </div>
  </footer>

  <script type="module" src="/js/main.js?v=1.0.1"></script>
</body>
</html>
